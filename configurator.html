<div class="configurator">
  <div class="config-stage">
    <div class="config-stage-frame">
      <img id="stageImage" src="" alt="" data-fallback-label="Giulia configuration preview" />
    </div>
    <div class="config-stage-angles" id="stageAngles">
      <button class="config-angle-btn active" data-angle="front">Frontale</button>
      <button class="config-angle-btn" data-angle="side">Laterale</button>
      <button class="config-angle-btn" data-angle="rear">Posteriore</button>
    </div>
  </div>

  <aside class="config-panel">
    <div class="config-section">
      <div class="config-section-title"><i class="fa-solid fa-car-side"></i>SCEGLI L'ALLESTIMENTO</div>
      <div class="config-trim-list" id="trimList"><!-- JS --></div>
    </div>

    <div class="config-section">
      <div class="config-section-title"><i class="fa-solid fa-palette"></i>COLORE CARROZZERIA</div>
      <div class="config-color-row" id="colorRow"><!-- JS --></div>
    </div>

    <div class="config-section">
      <div class="config-section-title"><i class="fa-solid fa-gauge-high"></i>SCHEDA TECNICA</div>
      <div class="config-spec-table" id="specTable"><!-- JS --></div>
    </div>

    <div class="config-summary">
      <p class="cs-name" id="summaryName">Giulia Quadrifoglio</p>
      <p class="cs-color" id="summaryColor">Rosso GTA</p>
      <div class="cs-actions">
        <a href="#" class="btn-primary" id="summaryAskBtn"><i class="fa-solid fa-comment-dots"></i>Chiedi le specifiche al manuale</a>
        <a href="gallery.html" class="btn-ghost"><i class="fa-solid fa-images"></i>Vedi la galleria completa</a>
      </div>
      <p class="config-saved-note" id="savedNote">&nbsp;</p>
    </div>
  </aside>
</div>

<script src="trim-data.js"></script>
<script src="nav.js"></script>
<script>
(() => {
  "use strict";
  let currentAngle = "front";

  function renderTrimList(active) {
    const wrap = document.getElementById("trimList");
    wrap.innerHTML = Object.values(ALFA_TRIMS).map((t) => `
      <button class="config-trim-option ${t.id === active ? "active" : ""}" data-trim="${t.id}">
        <span class="name">${t.name}</span>
        <span class="power">${t.hp} CV</span>
      </button>
    `).join("");
    wrap.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => alfaSetActiveTrim(b.dataset.trim)));
  }

  function renderColorRow(active) {
    const wrap = document.getElementById("colorRow");
    wrap.innerHTML = Object.values(ALFA_TRIMS).map((t) => `
      <button class="config-color-swatch ${t.id === active ? "active" : ""}" style="background:${t.swatch}" data-trim="${t.id}" title="${t.colorName}" aria-label="${t.colorName}"></button>
    `).join("");
    wrap.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => alfaSetActiveTrim(b.dataset.trim)));
  }

  function renderSpecs(t) {
    document.getElementById("specTable").innerHTML = `
      <div class="config-spec-row"><span>Motore</span><span>${t.drivetrain}</span></div>
      <div class="config-spec-row"><span>Potenza</span><span>${t.hp} CV</span></div>
      <div class="config-spec-row"><span>0&ndash;100 km/h</span><span>${t.zeroHundred}s</span></div>
      <div class="config-spec-row"><span>Velocit&agrave; massima</span><span>${t.topSpeed} km/h</span></div>
      <div class="config-spec-row"><span>Colore</span><span>${t.colorName}</span></div>
    `;
  }

  function applyStageImage(t) {
    const img = document.getElementById("stageImage");
    img.style.opacity = "0";
    window.setTimeout(() => {
      img.src = t.images[currentAngle];
      img.alt = `${t.name} — ${currentAngle}`;
      img.dataset.fallbackLabel = `${t.name} — ${currentAngle}`;
      img.dataset.fallbackApplied = "";
      alfaAttachImageFallback(img);
      img.style.opacity = "1";
    }, 120);
  }

  function applyTrim(t) {
    document.documentElement.style.setProperty("--accent-500", t.swatch);
    document.documentElement.style.setProperty("--accent-600", t.swatchDark);
    document.getElementById("summaryName").textContent = t.name;
    document.getElementById("summaryColor").textContent = t.colorName;
    document.getElementById("summaryAskBtn").href =
      "index.html?q=" + encodeURIComponent(`Tell me about the ${t.name} — engine, power, and DNA drive modes.`);
    renderTrimList(t.id);
    renderColorRow(t.id);
    renderSpecs(t);
    applyStageImage(t);

    const note = document.getElementById("savedNote");
    note.textContent = "Configurazione salvata in locale";
    window.setTimeout(() => { note.textContent = "\u00A0"; }, 1800);
  }

  document.querySelectorAll(".config-angle-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".config-angle-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentAngle = btn.dataset.angle;
      applyStageImage(ALFA_TRIMS[alfaGetActiveTrim()]);
    });
  });

  document.addEventListener("alfa:trim-change", (e) => applyTrim(e.detail));
  document.addEventListener("DOMContentLoaded", () => applyTrim(ALFA_TRIMS[alfaGetActiveTrim()]));
})();
</script>
</body>
